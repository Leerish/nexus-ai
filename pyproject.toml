[project]
name = "nexus-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "langchain-core>=1.5.4",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "nicegui>=3.15.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
nexus-ai = "nexus_ai:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
